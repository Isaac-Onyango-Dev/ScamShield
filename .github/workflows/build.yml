name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Report-only until the redesign's cleanup phase (docs/REDESIGN_PLAN.md §7.1, P6).
      - name: Design lint
        run: npm run lint:design

      # Chromium only; the browser directory is cached, OS packages are reinstalled on a hit.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E and accessibility tests
        run: npm run test:e2e
        env:
          E2E_NO_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Deploy a redirect from GitHub Pages to Render
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Redirect HTML
        run: |
          mkdir -p redirect_public
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://scamshield-dkmg.onrender.com/" /><title>Redirecting to ScamShield...</title><style>body{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f9fafb;}</style></head><body><div style="text-align:center;"><h2>Redirecting to ScamShield...</h2><p>If you are not redirected automatically, <a href="https://scamshield-dkmg.onrender.com/" style="color:#2563eb;text-decoration:none;">click here</a>.</p></div></body></html>' > redirect_public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect_public
